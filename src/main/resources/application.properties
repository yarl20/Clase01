spring.application.name=compunex-backend
server.port=8080

# Conexi\u00c3\u00b3n a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/compunex_b2b
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci\u00c3\u00b3n Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Seguridad JWT
jwt.secret=9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
jwt.expiration-ms=86400000

# Documentaci\u00c3\u00b3n Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

